name: Deploy web

# Publishes the web version to GitHub Pages:
#   https://mengnattawitmarin.github.io/dot-app/
# Installed apps also read catalog.json / stream-status.json from here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 22 * * *" # 05:41 Bangkok — refresh story/podcast episodes daily
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Refresh stories catalogue (podcasts.json)
        continue-on-error: true
        run: node scripts/fetch-podcasts.mjs

      - name: Refresh dharma catalogue (dharma.json)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # Start from the published copy so a failed refresh never empties the mode.
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/dharma.json" -o public/dharma.json || rm -f public/dharma.json
          node scripts/fetch-dharma.mjs

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Check backend connection
        continue-on-error: true
        # Writes dist/backend-check.json so the result can be read from the deployed site.
        run: |
          URL="${{ vars.SUPABASE_URL }}"; KEY="${{ vars.SUPABASE_ANON_KEY }}"
          URL="${URL:-$(grep -o 'https://[a-z0-9]*\.supabase\.co' src/lib/config.ts | head -1)}"
          KEY="${KEY:-$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' src/lib/config.ts | head -1)}"
          REST=$(curl -s -o /tmp/rest.txt -w "%{http_code}" "$URL/rest/v1/clips?select=id&limit=1" -H "apikey: $KEY" || echo 000)
          BUCKET=$(curl -s -o /dev/null -w "%{http_code}" "$URL/storage/v1/bucket/clips" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
          AUTH=$(curl -s "$URL/auth/v1/settings" -H "apikey: $KEY" || echo '{}')
          AUTOCONFIRM=$(echo "$AUTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).mailer_autoconfirm)}catch{console.log("unknown")}})')
          printf '{"checkedAt":"%s","rest_clips":%s,"rest_body":%s,"storage_bucket":%s,"email_autoconfirm":"%s"}\n' \
            "$(date -u +%FT%TZ)" "$REST" "$(head -c 300 /tmp/rest.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(s)))')" "$BUCKET" "$AUTOCONFIRM" > dist/backend-check.json
          cat dist/backend-check.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
