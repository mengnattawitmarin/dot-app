name: Stream health

# Checks every radio/TV/film URL once a day and publishes the dead list.
# Installed apps read stream-status.json from the website, so dead streams
# disappear without a store update.
on:
  schedule:
    - cron: "17 21 * * *" # 04:17 Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe streams
        run: node --experimental-strip-types scripts/check-streams.mjs
      - name: Commit status
        id: commit
        run: |
          if git diff --quiet public/stream-status.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "dot-bot"
          git config user.email "dot-bot@users.noreply.github.com"
          git add public/stream-status.json
          git commit -m "chore: update stream status"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so redeploy explicitly.
  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-web.yml
    permissions:
      contents: write
