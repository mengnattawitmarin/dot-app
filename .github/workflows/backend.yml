name: Backend (Supabase)

# Applies supabase/migrations and deploys the push Edge Function.
# Needs repository secrets:
#   SUPABASE_ACCESS_TOKEN   (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    (the xxxx in https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD    (set when you created the project)
# Optional, for push:
#   FIREBASE_SERVICE_ACCOUNT  (Firebase → Project settings → Service accounts → Generate key, paste the JSON)
#   WEBHOOK_SECRET            (any random string; also put it in the Database Webhook header)
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      HAS_FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Supabase secrets not set — skipping. See docs/BACKEND.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Apply database migrations
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD" --include-all

      - name: Set function secrets
        if: steps.cfg.outputs.ready == 'true' && env.HAS_FSA == 'true'
        env:
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: supabase secrets set --project-ref "$REF" FIREBASE_SERVICE_ACCOUNT="$FSA" WEBHOOK_SECRET="$WEBHOOK_SECRET"

      - name: Deploy push function
        if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy notify --project-ref "$REF" --no-verify-jwt
