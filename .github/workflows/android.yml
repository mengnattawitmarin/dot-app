name: Android APK

# Every push to main builds the app and publishes it as a GitHub Release.
# Stable download link: https://github.com/mengnattawitmarin/dot-app/releases/latest/download/DoT.apk
#
# Signed release (Play Store) — add these repository secrets and the job signs automatically:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release contains an installable debug APK.
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/stream-status.json"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Bundle stories catalogue into the app
        continue-on-error: true
        run: node scripts/fetch-podcasts.mjs

      - name: Bundle latest films list into the app
        continue-on-error: true
        run: curl -fsSL --retry 2 https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/films.json -o /tmp/films.json && node -e "JSON.parse(require('fs').readFileSync('/tmp/films.json','utf8')).titles.length" && cp /tmp/films.json public/films.json

      - name: Bundle latest dharma catalogue into the app
        continue-on-error: true
        run: curl -fsSL --retry 2 https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/dharma.json -o /tmp/dharma.json && node -e "JSON.parse(require('fs').readFileSync('/tmp/dharma.json','utf8')).teachers.length" && cp /tmp/dharma.json public/dharma.json

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_PUSH_ENABLED: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '' }}

      - name: Add Android platform (first run)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-native.mjs
          if [ "$HAS_FIREBASE" = "true" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          fi
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0a08' --splashBackgroundColor '#0b0a08' || true
          npx cap sync android

      - name: Set version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION.${{ github.run_number }}\"/" android/app/build.gradle
          echo "APP_VERSION=$VERSION.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          # Re-sign with the committed debug key so every build has the same signature
          # and installs as an update over the previous APK.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p ../out
          "$APKSIGNER" sign --ks ../android-signing/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out ../out/DoT.apk app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs ../out/DoT.apk | grep -i sha-256

      - name: Build signed APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          ./gradlew assembleRelease bundleRelease --no-daemon $SIGN
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/DoT.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/DoT.aab

      - uses: actions/upload-artifact@v4
        with:
          name: DoT-android
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Do.T ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            ดาวน์โหลด **DoT.apk** แล้วเปิดในมือถือ Android เพื่อติดตั้ง
            (ครั้งแรกเครื่องจะถามให้อนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก")

            Commit: ${{ github.sha }}
          files: out/*
